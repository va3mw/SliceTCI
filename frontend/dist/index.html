<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SliceTCI</title>
<style>
/* Styled after SmartSDR CAT / DAX: light Windows panel, list of port tiles. */
:root {
  --win: #ececec; --panel: #ffffff; --line: #c9c9c9; --line2: #e2e2e2;
  --text: #1e1e1e; --dim: #6b6b6b; --sel: #dcebfb;
  --blue: #1565d8; --red: #e0211b; --green: #3e8e3e; --grey: #8a8a8a;
  --btn: #3a3a3a; --btn-h: #555;
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text);
  font: 12px "Segoe UI", system-ui, sans-serif; }
body { display: flex; flex-direction: column; padding: 6px 8px 8px; gap: 6px; user-select: none; }
input, #log { user-select: text; }
button { font: inherit; cursor: pointer; }
select, input[type=text], input[type=number] { font: inherit; border: 1px solid #a9a9a9; border-radius: 2px;
  background: #fff; color: var(--text); padding: 2px 4px; }
input[type=number] { width: 72px; }
.top { display: flex; justify-content: flex-end; }
.link { background: none; border: none; color: var(--text); display: flex; align-items: center; gap: 4px; padding: 0; }
.link:hover { color: var(--blue); }
.radio { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line);
  padding: 8px 10px; min-height: 64px; }
.radio .txt { line-height: 1.35; font-size: 12.5px; }
.radio .txt .dim { color: var(--dim); }
.station { display: flex; align-items: center; gap: 6px; padding: 2px 2px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.station select { flex: 1; min-width: 0; }
.dot { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9a9a9a, #555); flex: none; }
.dot.on { background: radial-gradient(circle at 35% 35%, #7fb2ff, #1d4fbf); }
.dot.busy { background: radial-gradient(circle at 35% 35%, #ffd27a, #c88700); }
.txstrip { background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.txhead { display: flex; justify-content: space-between; align-items: center; }
.txhead b { font-weight: 600; }
#txState.on { color: var(--red); font-weight: 600; }
.dim { color: var(--dim); }
.list { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); min-height: 120px; }
.item { display: flex; gap: 10px; padding: 8px 8px; border-bottom: 1px solid var(--line2); position: relative; }
.item.sel { background: var(--sel); }
.tile { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 26px; font-weight: 400; background: var(--blue); }
.tile.err { background: var(--grey); }
.tile.tx { background: var(--red); }
.item .body { flex: 1; min-width: 0; line-height: 1.4; }
.item .name { font-size: 12.5px; }
.item .meter { height: 4px; background: #e6e6e6; margin-top: 4px; width: 100%; }
.item .meter > div { height: 100%; width: 0; background: #2fa84f; transition: width .2s; }
.pills { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.pill { color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--red); white-space: nowrap; }
.pill.blue { background: var(--blue); } .pill.green { background: var(--green); }
.buttons { display: flex; justify-content: space-between; gap: 6px; }
.btn { background: var(--btn); color: #fff; border: none; border-radius: 4px; padding: 5px 0; flex: 1; }
.btn:hover:not(:disabled) { background: var(--btn-h); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.light { background: #fff; color: var(--text); border: 1px solid #a9a9a9; }
/* dialogs */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 10; }
.modal.open { display: flex; }
.dlg { background: var(--win); border: 1px solid #888; margin: auto; width: calc(100% - 20px); max-height: calc(100% - 20px);
  display: flex; flex-direction: column; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.dlg h3 { margin: 0; padding: 8px 10px; font-size: 13px; font-weight: 600; background: #fff; border-bottom: 1px solid var(--line); }
.dlg .content { padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.dlg .foot { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.field { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 6px; }
.field label { color: var(--dim); }
.group { border: 1px solid var(--line); background: #fff; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.group > b { font-weight: 600; }
.slider { display: flex; align-items: center; gap: 6px; }
.slider input { flex: 1; }
.lvl { height: 8px; background: #20262e; position: relative; }
.lvl > div { height: 100%; width: 0; background: linear-gradient(90deg, #2fa84f 70%, #e8c21b 85%, #e0211b); transition: width .2s; }
.hint { color: var(--dim); font-size: 11px; }
.err-text { color: var(--red); }
/* log view */
#logDlg .dlg { width: calc(100% - 12px); height: calc(100% - 12px); max-height: none; }
#logbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
#log { flex: 1; overflow: auto; background: #fff; font: 11.5px var(--mono); padding: 4px 8px; white-space: pre-wrap;
  word-break: break-word; outline: none; border-top: none; }
.l .t { color: #888; } .l .s { color: #1f5fa8; }
.l.TRAFFIC { color: #7a7a7a; } .l.DEBUG { color: #555; }
.l.WARN { color: #a86b00; } .l.ERROR { color: var(--red); }
#toast { position: fixed; left: 8px; right: 8px; bottom: 44px; background: #fff3f2; border: 1px solid var(--red); color: #7a0d09;
  padding: 8px 10px; display: none; z-index: 20; }
</style>
</head>
<body>
<div class="top">
  <button class="link" id="btnSettings" title="Settings">Settings
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
  </button>
</div>

<div class="radio">
  <svg width="86" height="44" viewBox="0 0 86 44" aria-hidden="true">
    <rect x="2" y="6" width="82" height="34" rx="3" fill="#2b2d31"/>
    <rect x="2" y="6" width="82" height="5" rx="2" fill="#3b3e44"/>
    <rect x="8" y="16" width="34" height="14" rx="1" fill="#11161c"/>
    <rect x="10" y="18" width="30" height="2" fill="#2e6fd1" opacity=".7"/>
    <circle cx="62" cy="24" r="8" fill="#17191c" stroke="#4a4d53"/>
    <circle cx="76" cy="20" r="2" fill="#4a4d53"/><circle cx="76" cy="28" r="2" fill="#4a4d53"/>
    <rect x="6" y="40" width="8" height="3" fill="#1b1c1f"/><rect x="72" y="40" width="8" height="3" fill="#1b1c1f"/>
  </svg>
  <div class="txt" id="radioTxt"><span class="dim">Not connected</span></div>
</div>

<div class="station">
  <label for="stationSel">Station:</label>
  <select id="stationSel"></select>
  <span class="dot" id="dot" title="Radio connection"></span>
</div>

<div class="txstrip" title="Level of TCI transmit audio sent to the radio. Lower it if the transmit audio is too hot (ALC, splatter). Applies immediately, even while transmitting.">
  <div class="txhead"><b>TX Audio</b><span id="txState" class="dim">Idle</span></div>
  <div class="slider"><span class="dim">Gain</span><input id="txGain" type="range" min="-40" max="20" step="1"><span id="txGainVal" style="width:46px;text-align:right"></span></div>
  <div class="lvl"><div id="txLvl"></div></div>
</div>

<div class="list" id="list"></div>

<div class="buttons">
  <button class="btn" id="btnAdd">Add...</button>
  <button class="btn" id="btnEdit">Edit...</button>
  <button class="btn" id="btnLog">Log...</button>
  <button class="btn" id="btnRemove">Remove</button>
</div>

<!-- Edit channel -->
<div class="modal" id="editDlg"><div class="dlg">
  <h3 id="editTitle">Edit TCI channel</h3>
  <div class="content">
    <div class="field"><label for="eSlice">Slice</label>
      <select id="eSlice"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option><option>H</option></select></div>
    <div class="field"><label for="ePort">TCP port</label><input id="ePort" type="number" min="1024" max="65535"></div>
    <div class="field"><label for="eDax">DAX channel</label>
      <select id="eDax"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
    <div class="group">
      <b>RX gain</b>
      <div class="slider"><input id="eGain" type="range" min="-80" max="20" step="1"><span id="eGainVal" style="width:44px;text-align:right"></span></div>
      <div class="lvl"><div id="eLvl"></div></div>
      <div class="hint">Aim for about 30 dB on the WSJT-X meter.</div>
    </div>
    <div class="hint">Clients connect to <span class="mono">127.0.0.1:<span id="ePortHint"></span></span> as TCI receiver 1.</div>
  </div>
  <div class="foot">
    <button class="btn light" id="eReset" title="Back to defaults for this position">Defaults</button>
    <span style="flex:1"></span>
    <button class="btn" id="eOk" style="flex:0 0 72px">OK</button>
    <button class="btn light" id="eCancel" style="flex:0 0 72px">Cancel</button>
  </div>
</div></div>

<!-- Settings -->
<div class="modal" id="setDlg"><div class="dlg">
  <h3>Settings</h3>
  <div class="content">
    <div class="group">
      <b>Radio</b>
      <select id="radioSel"></select>
      <div class="slider"><input id="manualIp" type="text" placeholder="or IP address" style="flex:1">
        <button class="btn" id="btnConnect" style="flex:0 0 70px">Connect</button></div>
      <button class="btn light" id="btnDisconnect">Disconnect</button>
    </div>
    <div class="group">
      <b>Behaviour</b>
      <div class="field"><label for="unkeyMs" title="Unkey if the transmitting client stops sending TCI audio for this long">Safety unkey (ms)</label><input id="unkeyMs" type="number" min="500" max="10000" step="100"></div>
      <div class="field"><label for="maxTx" title="TX watchdog: the longest single transmission SliceTCI allows">Max TX time (s)</label><input id="maxTx" type="number" min="5" max="3600" step="5"></div>
      <div class="field"><label for="protoName">Protocol name</label><input id="protoName" type="text"></div>
      <label><input id="autoDax" type="checkbox"> Set the slice's DAX channel when a client connects</label>
      <label title="When a client transmits its own (TCI) audio: USB becomes DIGU, LSB becomes DIGL, and TX DAX is turned on if it was off. Both changes are logged and left in place."><input id="digitalTx" type="checkbox"> On TCI-audio transmit, switch USB/LSB to DIGU/DIGL and turn on TX DAX</label>
      <label title="Spots sent by TCI clients are shown on the SmartSDR panadapter for 15 minutes, and clicking one there is reported back to the clients. Turning this off removes the spots SliceTCI added."><input id="spots" type="checkbox"> Show TCI spots on the panadapter</label>
      <label><input id="logTraffic" type="checkbox"> Capture TCI/API traffic in the log</label>
    </div>
    <div class="group">
      <b>Install &amp; updates</b>
      <div class="hint" id="installLine"></div>
      <button class="btn" id="btnInstall" title="Copy SliceTCI to the settings folder under AppData, make a desktop shortcut and restart from there">Install in AppData</button>
      <div class="slider">
        <button class="btn light" id="btnShortcut" style="flex:1">Desktop shortcut</button>
        <button class="btn light" id="btnUpdate" style="flex:1">Check for updates</button>
      </div>
    </div>
    <div class="hint" id="aboutLine"></div>
  </div>
  <div class="foot"><span style="flex:1"></span>
    <button class="btn" id="setSave" style="flex:0 0 72px">Save</button>
    <button class="btn light" id="setClose" style="flex:0 0 72px">Close</button>
  </div>
</div></div>

<!-- Log -->
<div class="modal" id="logDlg"><div class="dlg">
  <h3>Log</h3>
  <div id="logbar">
    <select id="logLevel">
      <option value="0">Traffic +</option><option value="1">Debug +</option>
      <option value="2" selected>Info +</option><option value="3">Warnings +</option><option value="4">Errors</option>
    </select>
    <input id="logFilter" type="text" placeholder="filter" style="width:120px">
    <label><input id="logFollow" type="checkbox" checked> Follow</label>
    <span style="flex:1"></span>
    <button class="btn light" id="btnCopyLog" style="flex:0 0 auto;padding:4px 10px">Copy</button>
    <button class="btn light" id="btnClearLog" style="flex:0 0 auto;padding:4px 10px">Clear</button>
    <button class="btn light" id="btnLogFolder" style="flex:0 0 auto;padding:4px 10px">Folder</button>
    <button class="btn" id="btnLogClose" style="flex:0 0 auto;padding:4px 12px">Close</button>
  </div>
  <div id="log" tabindex="0"></div>
</div></div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const api = () => window.go.main.App;
const LEVELS = { TRAFFIC: 0, DEBUG: 1, INFO: 2, WARN: 3, ERROR: 4 };
const MAXLOG = 4000;
let status = null;
let logEntries = [], lastLogId = 0;
let selected = 0, editing = -1;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 6000);
}
async function call(fn, ...args) {
  try { return await api()[fn](...args); } catch (e) { toast(String(e)); throw e; }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const setOptions = (sel, items, value) => {
  sel.innerHTML = items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
  sel.value = value;
};
const fmtFreq = hz => { const s = String(hz).padStart(7, "0"); return s.slice(0, -6) + "." + s.slice(-6, -3) + "." + s.slice(-3); };
// Peak (0..1) to a 0..100% bar on a -60..0 dBFS scale, like DAX.
const pct = peak => peak <= 0 ? 0 : Math.max(0, Math.min(100, (20 * Math.log10(peak) + 60) / 60 * 100));
const gainOf = c => (c.rx_gain_db === null || c.rx_gain_db === undefined) ? -40 : c.rx_gain_db;
const open = id => $(id).classList.add("open");
const close = id => $(id).classList.remove("open");
const isOpen = id => $(id).classList.contains("open");

// ---------- main view ----------
function renderHeader(s) {
  const r = s.radio, c = s.config;
  const connecting = !r.connected && c.auto_connect && (c.radio_ip || c.radio_serial);
  $("radioTxt").innerHTML = r.connected
    ? `${esc(r.model || "FlexRadio")}<br>${esc(r.nickname || r.ip)}<br>${esc(r.callsign || "")}`
    : `<span class="dim">${connecting ? "Connecting…" : "Not connected"}</span><br><span class="dim">${esc(c.radio_ip || "")}</span>`;
  const dot = $("dot");
  dot.className = "dot" + (r.connected && r.bound_station ? " on" : (r.connected || connecting ? " busy" : ""));
  dot.title = r.connected ? (r.bound_station ? `Bound to ${r.bound_station}` : "Connected, no station bound") : "Not connected";

  const st = $("stationSel");
  if (document.activeElement !== st) {
    const list = r.stations || [];
    const items = [["", list.length === 1 ? `${list[0].name} (auto)` : "Auto (only station)"]].concat(list.map(x => [x.name, x.name]));
    if (c.station && !list.some(x => x.name === c.station)) items.push([c.station, c.station + " (not connected)"]);
    setOptions(st, items, c.station);
    const b = list.find(x => x.name === r.bound_station);
    st.title = b ? `${b.program}: ${b.client_id}` : "";
  }
}

function renderList(s) {
  const list = $("list");
  const n = s.config.channel_count;
  if (selected >= n) selected = n - 1;
  if (list.childElementCount !== n) {
    list.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `<div class="tile">T</div><div class="body"></div><div class="pills"></div>`;
      el.onclick = () => { selected = i; renderList(status); };
      el.ondblclick = () => { selected = i; openEdit(i); };
      list.appendChild(el);
    }
  }
  for (let i = 0; i < n; i++) {
    const el = list.children[i];
    const cfg = s.config.channels[i];
    const cs = (s.channels || []).find(c => c.index === i) || {};
    const clients = cs.clients || [];
    const tx = cs.trx;
    el.classList.toggle("sel", i === selected);
    const tile = el.querySelector(".tile");
    tile.className = "tile" + (cs.error ? " err" : tx ? " tx" : "");
    const audio = clients.find(c => c.audio);
    const slice = s.radio.connected && cs.present
      ? `Slice: ${cfg.slice} &nbsp;${fmtFreq(cs.freq_hz)} ${esc((cs.mode || "").toUpperCase())}`
      : `Slice: ${cfg.slice}`;
    const client = clients.length
      ? clients.map(c => `${esc(c.remote)}${c.audio ? ` (${c.rate / 1000}k)` : ""}`).join(", ")
      : "(None)";
    el.querySelector(".body").innerHTML =
      `<div class="name">TCI-${cfg.slice}</div>
       <div>TCP: Port ${cfg.port} &nbsp;DAX: ${cfg.dax}</div>
       <div>${slice}</div>
       <div>Client: ${client}</div>
       ${audio ? `<div class="meter"><div style="width:${pct(cs.rx_level)}%"></div></div>` : ""}`;
    const pills = [];
    if (cs.error) pills.push(`<span class="pill" title="${esc(cs.error)}">Port In Use</span>`);
    else if (s.radio.connected && !cs.present) pills.push(`<span class="pill">Not Present</span>`);
    if (tx) pills.push(`<span class="pill">TX</span>`);
    else if (cs.present && !cs.tx_enable && s.radio.connected) pills.push(`<span class="pill">TX Inhibit</span>`);
    if (audio && !tx) pills.push(`<span class="pill blue">Audio</span>`);
    el.querySelector(".pills").innerHTML = pills.join("");
  }
  $("btnRemove").disabled = n <= 1;
  $("btnAdd").disabled = n >= 8;
}

function onStatus(s) {
  status = s;
  renderHeader(s);
  renderList(s);
  if (isOpen("editDlg")) {
    const cs = (s.channels || []).find(c => c.index === editing);
    $("eLvl").style.width = (cs ? pct(cs.rx_level) : 0) + "%";
  }
  if (isOpen("setDlg")) renderSettings(s, false);
  renderTX(s);
}

// ---------- edit dialog ----------
let savedGain = null; // the channel's saved RX gain while the Edit dialog previews another
function openEdit(i) {
  editing = i;
  const c = status.config.channels[i];
  savedGain = gainOf(c);
  $("editTitle").textContent = `Edit TCI-${c.slice}`;
  $("eSlice").value = c.slice; $("ePort").value = c.port; $("eDax").value = c.dax;
  $("eGain").value = gainOf(c); $("eGainVal").textContent = gainOf(c) + " dB";
  $("ePortHint").textContent = c.port;
  open("editDlg");
}
$("ePort").oninput = () => $("ePortHint").textContent = $("ePort").value;
// The slider is heard live; OK keeps it, Cancel (or Escape) goes back.
$("eGain").oninput = () => {
  $("eGainVal").textContent = $("eGain").value + " dB";
  api().PreviewRXGain(editing, +$("eGain").value).catch(() => {});
};
function cancelEdit() {
  if (!isOpen("editDlg")) return;
  if (savedGain !== null && +$("eGain").value !== savedGain) api().PreviewRXGain(editing, savedGain).catch(() => {});
  close("editDlg");
}
$("eCancel").onclick = cancelEdit;
$("eReset").onclick = async () => {
  await call("ResetChannel", editing).catch(() => {});
  onStatus(await call("GetStatus")); openEdit(editing);
};
$("eOk").onclick = async () => {
  const ch = { slice: $("eSlice").value, port: +$("ePort").value, dax: +$("eDax").value, rx_gain_db: +$("eGain").value };
  try { await call("UpdateChannel", editing, ch); } catch { return; }
  close("editDlg"); onStatus(await call("GetStatus"));
};

// ---------- settings ----------
function renderSettings(s, force) {
  const c = s.config, ae = document.activeElement;
  if (force || ae !== $("radioSel")) {
    const items = [["", s.radios.length ? "— select radio —" : "— no radios found —"]]
      .concat(s.radios.map(r => [r.serial, `${r.model} "${r.nickname}" ${r.ip}`]));
    const want = (force ? "" : $("radioSel").value) || c.radio_serial;
    setOptions($("radioSel"), items, s.radios.some(r => r.serial === want) ? want : "");
  }
  if (force) {
    $("unkeyMs").value = c.unkey_timeout_ms; $("protoName").value = c.protocol_name;
    $("maxTx").value = c.max_tx_seconds;
    $("autoDax").checked = c.set_slice_dax; $("logTraffic").checked = c.log_traffic;
    $("digitalTx").checked = c.digital_on_tx; $("spots").checked = c.spots;
  }
}
$("btnSettings").onclick = async () => {
  status = await call("GetStatus");
  renderSettings(status, true);
  renderInstall(await call("GetInstallState"));
  open("setDlg");
};
function renderInstall(st) {
  $("installLine").textContent = `Version ${st.version}, running from ${st.exe}`;
  $("btnInstall").style.display = st.installed ? "none" : "";
}
// Each action may ask a question in a native dialog and may restart SliceTCI.
async function installAction(fn, btn) {
  btn.disabled = true;
  try {
    const msg = await call(fn);
    if (msg) toast(msg);
  } catch {
  } finally {
    btn.disabled = false;
  }
}
$("btnInstall").onclick = () => installAction("Install", $("btnInstall"));
$("btnShortcut").onclick = () => installAction("CreateShortcut", $("btnShortcut"));
$("btnUpdate").onclick = () => installAction("CheckForUpdates", $("btnUpdate"));
$("setClose").onclick = () => close("setDlg");
$("btnConnect").onclick = () => {
  const serial = $("radioSel").value, ip = $("manualIp").value.trim();
  if (!serial && !ip) return toast("Pick a radio or enter its IP address.");
  call("Connect", ip ? "" : serial, ip);
};
$("btnDisconnect").onclick = () => call("Disconnect");
// ---------- TX audio strip ----------
const fmtDb = v => (v > 0 ? "+" : "") + v + " dB";
let txDragging = false;
function renderTX(s) {
  if (!txDragging && document.activeElement !== $("txGain")) {
    $("txGain").value = s.config.tx_gain_db;
    $("txGainVal").textContent = fmtDb(s.config.tx_gain_db);
  }
  $("txLvl").style.width = pct(s.tx_level) + "%";
  const st = $("txState");
  st.textContent = s.tx_owner || "Idle";
  st.className = s.tx_owner ? "on" : "dim";
}
// Apply while dragging (throttled) so the level can be set during a transmission.
let txSend = null;
$("txGain").oninput = () => {
  txDragging = true;
  const v = +$("txGain").value;
  $("txGainVal").textContent = fmtDb(v);
  clearTimeout(txSend);
  txSend = setTimeout(() => call("SetTXGain", v), 80);
};
$("txGain").onchange = () => {
  txDragging = false;
  clearTimeout(txSend);
  call("SetTXGain", +$("txGain").value);
  $("txGain").blur();
};
$("setSave").onclick = async () => {
  try {
    await call("SetOptions", {
      unkey_timeout_ms: +$("unkeyMs").value, protocol_name: $("protoName").value, max_tx_seconds: +$("maxTx").value,
      set_slice_dax: $("autoDax").checked, digital_on_tx: $("digitalTx").checked, spots: $("spots").checked, log_traffic: $("logTraffic").checked,
    });
  } catch { return; }
  close("setDlg");
};

// ---------- log ----------
function logLine(e) {
  return `<div class="l ${e.level}"><span class="t">${e.time}</span> ${e.level.padEnd(7)} <span class="s">${esc(e.source.padEnd(10))}</span> ${esc(e.msg)}</div>`;
}
function visible(e) {
  const min = +$("logLevel").value, f = $("logFilter").value.toLowerCase();
  return LEVELS[e.level] >= min && (!f || (e.msg + " " + e.source).toLowerCase().includes(f));
}
function redrawLog() {
  $("log").innerHTML = logEntries.filter(visible).map(logLine).join("");
  if ($("logFollow").checked) $("log").scrollTop = $("log").scrollHeight;
}
function addLogs(batch) {
  batch = (batch || []).filter(e => e.id > lastLogId);
  if (!batch.length) return;
  lastLogId = batch[batch.length - 1].id;
  logEntries.push(...batch);
  if (logEntries.length > MAXLOG) logEntries = logEntries.slice(-MAXLOG);
  if (!isOpen("logDlg")) return;
  const log = $("log");
  log.insertAdjacentHTML("beforeend", batch.filter(visible).map(logLine).join(""));
  while (log.childElementCount > MAXLOG) log.firstElementChild.remove();
  if ($("logFollow").checked) log.scrollTop = log.scrollHeight;
}
let savedSize = null;
$("btnLog").onclick = async () => {
  open("logDlg"); redrawLog(); $("log").focus();
  // Widen the window while the log is open; restore it on close.
  try {
    savedSize = await window.runtime.WindowGetSize();
    if (savedSize.w < 900) window.runtime.WindowSetSize(900, Math.max(savedSize.h, 640));
  } catch { savedSize = null; }
};
$("btnLogClose").onclick = () => {
  close("logDlg");
  if (savedSize) window.runtime.WindowSetSize(savedSize.w, savedSize.h);
};
$("logLevel").onchange = redrawLog;
$("logFilter").oninput = redrawLog;
$("btnClearLog").onclick = () => { logEntries = []; $("log").innerHTML = ""; };
$("btnCopyLog").onclick = () => {
  const text = logEntries.filter(visible).map(e => `${e.time} ${e.level} ${e.source} ${e.msg}`).join("\n");
  navigator.clipboard.writeText(text).then(() => toast("Log copied to clipboard"));
};
$("btnLogFolder").onclick = () => call("OpenLogFolder");
// Ctrl+A selects the log text only.
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a" && !["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    if (!isOpen("logDlg")) return;
    const r = document.createRange(); r.selectNodeContents($("log"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  if (e.key === "Escape") { cancelEdit(); close("setDlg"); }
});

// ---------- main buttons ----------
$("stationSel").onchange = e => call("SelectStation", e.target.value);
$("btnAdd").onclick = async () => {
  await call("AddChannel").catch(() => {});
  onStatus(await call("GetStatus")); selected = status.config.channel_count - 1; renderList(status);
};
$("btnEdit").onclick = () => openEdit(selected);
$("btnRemove").onclick = async () => {
  const c = status.config.channels[selected];
  if (!confirm(`Remove TCI-${c.slice} (port ${c.port})? Connected clients will be dropped.`)) return;
  await call("RemoveChannel", selected).catch(() => {});
  onStatus(await call("GetStatus"));
};

async function init() {
  window.runtime.EventsOn("status", onStatus);
  window.runtime.EventsOn("log", addLogs);
  addLogs(await call("GetLogs", 0));
  onStatus(await call("GetStatus"));
  try { $("aboutLine").textContent = "Settings: " + (await api().ConfigDir()); } catch {}
}
window.addEventListener("load", init);
</script>
</body>
</html>
